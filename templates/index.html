<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- MXH -->
    <link rel="icon" href="{{ url_for('static', path='icons/favicon.ico') }}" />
    <meta name="theme-color" content="#D400FF" />
    <meta name="description" content="Rút gọn liên kết nhanh chóng, an toàn và tiện lợi cho học sinh – giáo viên.">
    <meta property="og:title" content="Link shortener" />
    <meta property="og:description" content="Chia sẻ link cho bạn bè, thầy cô thật nhanh và gọn! Hệ thống rút gọn link dành riêng cho trường, miễn phí và dễ dàng." />
    <meta property="og:image" content="{{ url_for('static', path='icons/favicon.ico') }}"/>

    <title>Link shortener - Rút gọn liên kết</title>
    
    <!-- Theme initialization script - MUST be before body to prevent flash -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline@2.4.1/dist/preline.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/bootstrap-icons.css') }}">
    
    <script src="{{ url_for('static', path='js/tailwindcss-main.js') }}"></script>
    <script src="{{ url_for('static', path='js/preline.min.js') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', path='css/common.css') }}">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 bg-white dark:bg-neutral-900 border-b border-gray-200 dark:border-neutral-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <a href="/" class="flex items-center gap-2 text-xl font-bold text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400">
                    <i class="bi bi-link-45deg text-2xl"></i>
                    <span>Link Shortener</span>
                </a>
                
                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center gap-2">
                    <button id="theme-toggle-mobile" class="p-2 rounded-lg border border-gray-300 dark:border-neutral-700 hover:bg-gray-100 dark:hover:bg-neutral-800" aria-label="Toggle theme">
                        <i class="bi bi-sun-fill text-yellow-500" id="light-icon-mobile"></i>
                        <i class="bi bi-moon-stars-fill text-blue-400 hidden" id="dark-icon-mobile"></i>
                    </button>
                    
                    <button class="hs-collapse-toggle p-2 rounded-lg border border-gray-300 dark:border-neutral-700 hover:bg-gray-100 dark:hover:bg-neutral-800" type="button" data-hs-collapse="#navbarNav" aria-controls="navbarNav">
                        <i class="bi bi-list text-xl"></i>
                    </button>
                </div>
                
                <!-- Desktop Menu -->
                <div id="navbarNav" class="hidden md:flex md:items-center md:gap-6">
                    <ul class="flex gap-6">
                        <li><a href="/" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">Trang chủ</a></li>
                        <li><a href="#" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">Hướng dẫn</a></li>
                        <li><a href="#" class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition">Liên hệ</a></li>
                    </ul>
                    <button id="theme-toggle" class="p-2 rounded-lg border border-gray-300 dark:border-neutral-700 hover:bg-gray-100 dark:hover:bg-neutral-800" aria-label="Toggle theme">
                        <i class="bi bi-sun-fill text-yellow-500" id="light-icon"></i>
                        <i class="bi bi-moon-stars-fill text-blue-400 hidden" id="dark-icon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-2xl">
            <!-- TITLE -->
            <div class="text-center mb-8">
                <h1 class="text-4xl md:text-5xl font-bold mb-3 text-gray-900 dark:text-white">Rút Gọn Liên Kết</h1>
                <p class="text-lg text-gray-600 dark:text-gray-400">Nhanh chóng – An toàn – Không quảng cáo</p>
            </div>

            <!-- CARD FORM -->
            <div class="bg-white dark:bg-neutral-900 rounded-xl shadow-lg dark:shadow-neutral-900/50 border border-gray-200 dark:border-neutral-800 overflow-hidden mb-6">
                <!-- Card Header -->
                <div class="bg-gray-50 dark:bg-neutral-800 border-b border-gray-200 dark:border-neutral-700 px-6 py-4">
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Nhập liên kết</h2>
                </div>
                
                <!-- Card Body -->
                <div class="p-6 space-y-5">
                    <!-- URL Input -->
                    <div>
                        <label for="input_url" class="block text-sm font-medium text-gray-900 dark:text-white mb-2">
                            URL cần rút gọn
                            <span class="text-red-500">*</span>
                        </label>
                        <input 
                            type="url"
                            id="input_url"
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            placeholder="https://example.com"
                            required
                        />
                        <div id="error_input_url" class="form-error mt-1 text-sm text-red-500"></div>
                    </div>

                    <!-- Options Row -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <!-- Custom Code -->
                        <div>
                            <label for="custom_code" class="block text-sm font-medium text-gray-900 dark:text-white mb-2">
                                Mã rút gọn (tùy chọn)
                            </label>
                            <input 
                                type="text"
                                id="custom_code"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="mycode"
                            />
                            <div id="error_custom_code" class="form-error mt-1 text-sm text-red-500"></div>
                        </div>

                        <!-- Expiry Date -->
                        <div>
                            <label for="expiry_date" class="block text-sm font-medium text-gray-900 dark:text-white mb-2">
                                Ngày hết hạn
                            </label>
                            <input 
                                type="date"
                                id="expiry_date"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            />
                            <div id="error_expiry_date" class="form-error mt-1 text-sm text-red-500"></div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="flex justify-center pt-2">
                        <button 
                            id="btn_create"
                            class="px-8 py-3 bg-neutral-600 hover:bg-neutral-700 dark:bg-neutral-700 dark:hover:bg-neutral-600 text-white font-semibold rounded-lg transition flex items-center justify-center gap-2"
                        >
                            <span id="create_text">Tạo liên kết</span>
                            <span id="create_loading" class="hidden">
                                <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- RESULT BOX -->
            <div id="result_box" class="hidden bg-white dark:bg-neutral-900 rounded-xl shadow-lg dark:shadow-neutral-900/50 border border-gray-200 dark:border-neutral-800 overflow-hidden">
                <!-- Result Header -->
                <div class="bg-gray-50 dark:bg-neutral-800 border-b border-gray-200 dark:border-neutral-700 px-6 py-4">
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Kết quả</h3>
                </div>
                
                <!-- Result Content -->
                <div class="p-6 space-y-6">
                    <!-- Short URL Input + Copy Button -->
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input 
                            id="short_url" 
                            readonly
                            class="flex-1 px-4 py-3 rounded-lg border border-gray-300 dark:border-neutral-700 bg-gray-50 dark:bg-neutral-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 transition"
                        />
                        <button 
                            id="btn_copy"
                            class="px-6 py-3 bg-gray-100 dark:bg-neutral-800 hover:bg-gray-200 dark:hover:bg-neutral-700 border border-gray-300 dark:border-neutral-700 text-gray-900 dark:text-white font-medium rounded-lg transition flex items-center justify-center gap-2 whitespace-nowrap"
                        >
                            <i class="bi bi-clipboard"></i>
                            Copy
                        </button>
                    </div>

                    <!-- QR Code Section -->
                    <div class="border border-gray-200 dark:border-neutral-800 rounded-lg p-6 text-center bg-gray-50 dark:bg-neutral-800">
                        <h4 class="text-sm font-semibold text-gray-600 dark:text-gray-400 mb-4">QR Code</h4>
                        <img 
                            id="qr_image" 
                            src="" 
                            alt="QR Code" 
                            class="mx-auto w-48 h-48 border border-gray-200 dark:border-neutral-700 rounded-lg p-3 mb-4 bg-white dark:bg-neutral-900"
                        />
                        <button 
                            id="btn_download_qr"
                            class="w-full px-4 py-2 bg-neutral-600 hover:bg-neutral-700 dark:bg-neutral-700 dark:hover:bg-neutral-600 text-white font-medium rounded-lg transition flex items-center justify-center gap-2"
                        >
                            <i class="bi bi-download"></i>
                            Tải QR
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Preline & Tailwind JS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline@2.4.1/dist/preline.js"></script>
    
    <!-- Your existing common.js -->
    <script src="{{ url_for('static', path='js/common.js') }}"></script>
</body>
<script src="{{ url_for('static', path='js/common.js') }}"></script>

</html>
