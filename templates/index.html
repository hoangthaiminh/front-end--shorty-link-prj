<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- MXH --!>
    <link rel="icon" href="{{ url_for('static', path='icons/favicon.ico') }}" />
    <meta name="theme-color" content="#D400FF" />
    <meta name="description" content="Rút gọn liên kết nhanh chóng, an toàn và tiện lợi cho học sinh – giáo viên.">
    <meta property="og:title" content="Link shortener" />
    <meta property="og:description" content="Chia sẻ link cho bạn bè, thầy cô thật nhanh và gọn! Hệ thống rút gọn link dành riêng cho trường, miễn phí và dễ dùng." />
    <meta property="og:image" content="{{ url_for('static', path='icons/favicon.ico') }}"/>
    <!--------->

    <title>Link shortener - Rút gọn liên kết</title>
	  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/bootstrap-icons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/common.css') }}">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-md border-bottom sticky-top shadow-sm">
        <div class="container-xl">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-link-45deg fs-3"></i>
                <span>Link Shortener</span>
            </a>
            
            <div class="d-flex align-items-center gap-2 d-md-none">
                <!-- Theme Toggle Mobile -->
                <button id="theme-toggle-mobile" class="btn btn-outline-secondary btn-sm" aria-label="Toggle theme">
                    <i class="bi bi-sun-fill theme-toggle-icon" id="light-icon-mobile"></i>
                    <i class="bi bi-moon-stars-fill theme-toggle-icon d-none" id="dark-icon-mobile"></i>
                </button>
                
                <!-- Mobile Menu Toggle -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-md-center gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Hướng dẫn</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Liên hệ</a>
                    </li>
                    <li class="nav-item d-none d-md-block">
                        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" aria-label="Toggle theme">
                            <i class="bi bi-sun-fill theme-toggle-icon" id="light-icon"></i>
                            <i class="bi bi-moon-stars-fill theme-toggle-icon d-none" id="dark-icon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
        <!-- Mik chưa lm đc darkmode =)) (update: mih da lam duoc dark mode) -->
        <!-- <button id="theme_toggle" class="theme-toggle btn btn-sm outline" aria-label="Đổi giao diện"> -->
          <!-- <i class="bi bi-sun-fill icon icon-light"></i> -->
          <!-- <i class="bi bi-moon-stars-fill icon icon-dark"></i> -->
          <!-- <i class="bi bi-circle-half icon icon-system"></i> -->
        <!-- </button> -->


    <!-- MAIN CONTENT -->
    <div class="container py-5" style="max-width: 800px;">
        <!-- TITLE -->
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold mb-2">Rút Gọn Liên Kết</h1>
            <p class="text-muted">Nhanh chóng – An toàn – Không quảng cáo</p>
        </div>

        <!-- CARD FORM -->
        <div class="card shadow-sm mb-4">
            <div class="card-header">
                <h5 class="card-title mb-0">Nhập liên kết</h5>
            </div>
            
            <div class="card-body p-4">
                <!-- URL Input -->
                <div class="mb-4">
                    <label for="input_url" class="form-label required">URL cần rút gọn</label>
                    <input 
                        type="url"
                        id="input_url"
                        class="form-control"
                        required
                    >
                    <div id="error_input_url" class="form-error"></div>
                </div>

                <!-- Options -->
                <div class="row g-3 mb-4">
                    <!-- Custom Code -->
                    <div class="col-md-6">
                        <label for="custom_code" class="form-label">Mã rút gọn (tuỳ chọn)</label>
                        <input 
                            type="text"
                            id="custom_code"
                            class="form-control"
                        >
                        <div id="error_custom_code" class="form-error"></div>
                    </div>

                    <!-- Expiry Date -->
                    <div class="col-md-6">
                        <label for="expiry_date" class="form-label">Ngày hết hạn</label>
                        <input 
                            type="date"
                            id="expiry_date"
                            class="form-control"
                        >
                        <div id="error_expiry_date" class="form-error"></div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                    <button 
                        id="btn_create"
                        class="btn btn-primary btn-lg px-5"
                    >
                        <span id="create_text">Tạo liên kết</span>
                        <span id="create_loading" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 3️⃣ KẾT QUẢ -->
        <div id="result_box" data-role="result"
             class="m-7 hidden mt-6 border border-gray-400 dark:border-neutral-700 
                    bg-white dark:bg-neutral-900 overflow-auto
                    shadow-sm dark:shadow-neutral-800/50 
                    rounded-xl">

          <div class="bg-gray-100 border-b border-gray-200 rounded-t-xl py-3 px-4 md:py-4 md:px-5 dark:bg-neutral-900 dark:border-neutral-700">
            <p class="mt-1 text-lg font-semibold text-gray-500 dark:text-neutral-700">
              Kết quả
            </p>
          </div>
          
          <div class="p-5 md:p-6">

              <!-- Input + Copy -->
              <div class="flex flex-wrap gap-3 mb-4">
                <input id="short_url" readonly
                  class="flex-1 px-4 py-3 rounded-lg bg-white dark:bg-neutral-800
                         border border-gray-300 dark:border-neutral-600
                         text-gray-900 dark:text-gray-100
                         focus:border-gray-500 focus:ring-1 focus:ring-gray-400 
                         outline-none transition" />

                <button id="btn_copy" data-role="copy"
                  class="px-4 min-w-[90px] min-h-[50px] rounded-lg border border-gray-300 
                         dark:border-neutral-600 
                         text-gray-700 dark:text-gray-200 
                         hover:bg-gray-100 dark:hover:bg-neutral-800 
                         transition flex items-center justify-center gap-x-2">

                  <i class="bi bi-clipboard"></i>

                  Copy
                </button>
              </div>
                <!-- QR Code Card -->
                <div class="card">
                    <div class="card-header">
                        <h6 class="card-subtitle mb-0 text-muted">QR Code</h6>
                    </div>
                    <div class="card-body text-center py-4">
                        <img id="qr_image" src="" alt="QR Code" class="img-fluid rounded border p-2 mb-3" />
                        <div>
                            <button id="btn_download_qr" class="btn btn-outline-primary">
                                <i class="bi bi-download me-1"></i>
                                Tải QR
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    
    <!-- Your existing common.js -->
    <script src="{{ url_for('static', path='js/common.js') }}"></script>
</body>
</html>
